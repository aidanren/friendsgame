<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Episode Guessing Game</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#eab308",
        "background-light": "#f8fafc",
        "background-dark": "#0f172a",
        "panel-dark": "#1e293b",
        correct: "#10b981",
        incorrect: "#ef4444"
      },
      fontFamily: {
        display: ["Montserrat", "sans-serif"],
        marker: ["Permanent Marker", "cursive"]
      },
      borderRadius: {
        DEFAULT: "0.75rem"
      }
    }
  }
};
</script>
<style>
.glow-border {
  box-shadow: 0 0 15px rgba(234, 179, 8, 0.15);
  border: 1px solid rgba(234, 179, 8, 0.3);
}
.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.1);
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #475569;
  border-radius: 10px;
}

/* Wrapper ensures horizontal scroll if grid is too wide */
.episode-grid-wrapper {
  width: 100%;
}

/* Episode Grid */
.episode-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(50px, 1fr));
  grid-template-rows: repeat(25, minmax(50px, 1fr));
  gap: 6px;
  padding: 6px;
}

/* Episode cells */
.episode-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px;
  border-radius: 0.75rem;
  background-color: #f1f5f9;
  color: #0f172a;
  font-weight: 700;
  cursor: default;
  transition: all 0.2s;
  word-wrap: break-word;
  white-space: normal;
  min-width: 50px;
  min-height: 50px;
  font-size: 0.875rem;
}

.episode-cell.correct {
  background-color: #10b981;
  color: white;
}

.episode-cell.incorrect {
  background-color: #ef4444;
  color: white;
}

/* Smaller screens adjustments */
@media (max-width: 640px) {
  .episode-cell {
    min-width: 40px;
    min-height: 40px;
    font-size: 0.7rem;
  }
}

/* Mobile overlay button */
#mobile-grid-btn {
  display: none;
}
@media (max-width: 800px) {
  #mobile-grid-btn {
    display: block;
  }
}

/* Mobile overlay styling */
#grid-overlay {
  display: none;
}
#grid-overlay.active {
  display: flex;
}
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display transition-colors duration-300">

<div class="container mx-auto p-4 lg:p-8 h-screen flex flex-col">
  <div class="flex flex-col lg:flex-row gap-6 h-full overflow-hidden">

    <!-- Sidebar/Game Panel -->
    <aside class="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-6">
      <div class="bg-white dark:bg-panel-dark p-8 rounded-2xl glow-border flex flex-col items-center text-center h-full">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Friends_Logo_White.png" class="w-52 mb-4">
        <h1 class="text-4xl md:text-5xl font-black tracking-widest mb-2 text-primary">Episode Guessing Game</h1>
        <p id="episode-title" class="text-xl font-marker mb-6"></p>

        <div class="w-full grid grid-cols-2 gap-4 mb-4">
          <div class="space-y-2">
            <label class="text-xs uppercase font-bold opacity-60 block text-left">Season</label>
            <input type="number" id="season-input" min="1" class="w-full bg-slate-100 dark:bg-slate-800 border-1px rounded-xl text-center py-3 text-xl font-bold focus:ring-2 focus:ring-primary">
          </div>
          <div class="space-y-2">
            <label class="text-xs uppercase font-bold opacity-60 block text-left">Episode</label>
            <input type="number" id="episode-input" min="1" class="w-full bg-slate-100 dark:bg-slate-800 border-1px rounded-xl text-center py-3 text-xl font-bold focus:ring-2 focus:ring-primary">
          </div>
        </div>

        <div class="flex flex-col gap-3 w-full mb-4">
          <button id="submit-btn" class="w-full bg-primary hover:bg-yellow-500 text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-yellow-500/20 transition-all active:scale-95 flex items-center justify-center gap-2">
            <span class="material-icons">send</span> Submit
          </button>
          <button id="restart-btn" class="w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 font-bold py-3 rounded-xl transition-all active:scale-95 text-sm">
            Restart
          </button>
        </div>

        <p class="feedback text-lg font-bold mb-2" id="feedback"></p>
        <div class="w-full grid grid-cols-2 gap-4 text-sm">
          <div class="bg-correct/10 p-3 rounded-lg text-center">
            <span class="block text-[10px] uppercase font-bold text-correct mb-1">Correct</span>
            <span class="text-xl font-black text-correct" id="score">0</span>
          </div>
          <div class="bg-incorrect/10 p-3 rounded-lg text-center">
            <span class="block text-[10px] uppercase font-bold text-incorrect mb-1">Incorrect</span>
            <span class="text-xl font-black text-incorrect" id="incorrect-score">0</span>
          </div>
        </div>
        <p class="text-xs mt-2">High Score: <span id="high-score">0</span></p>
        <p class="text-xs">Last Played: <span id="last-played">-</span></p>
      </div>
    </aside>

    <!-- Main Grid -->
    <main class="flex-grow bg-white dark:bg-panel-dark rounded-2xl glow-border flex flex-col overflow-hidden">
      <header class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
        <div class="flex items-center gap-4">
          <span class="material-icons text-primary">grid_view</span>
          <h3 class="font-bold uppercase tracking-widest text-sm">Episode Grid</h3>
        </div>
      </header>
      <div class="p-4 flex-grow overflow-auto custom-scrollbar">
        <div class="episode-grid-wrapper overflow-x-auto">
          <div class="episode-grid" id="episodeGrid"></div>
        </div>
      </div>
      <footer class="p-4 bg-slate-50 dark:bg-slate-800/30 border-t border-slate-200 dark:border-slate-700 text-center text-[10px] opacity-40 font-bold uppercase tracking-widest">
        Friends Episode Grid
      </footer>
    </main>

  </div>
</div>

<!-- Mobile Grid Button -->
<button id="mobile-grid-btn" class="fixed bottom-6 left-6 bg-primary text-slate-900 font-bold py-3 px-4 rounded-xl shadow-lg z-50">
  Show Grid
</button>

<!-- Overlay -->
<div id="grid-overlay" class="fixed inset-0 bg-black/80 hidden z-40 flex flex-col">
  <div class="flex justify-end p-4">
    <button id="close-overlay" class="text-white text-3xl font-bold">×</button>
  </div>
  <div class="flex-grow overflow-auto p-6">
    <div class="episode-grid-wrapper overflow-x-auto">
      <div class="episode-grid" id="mobileEpisodeGrid"></div>
    </div>
  </div>
</div>

<!-- Dark Mode Toggle -->
<button class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-white dark:bg-panel-dark shadow-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700 hover:scale-110 transition-transform" onclick="document.documentElement.classList.toggle('dark')">
  <span class="material-icons dark:hidden text-slate-800">dark_mode</span>
  <span class="material-icons hidden dark:block text-yellow-400">light_mode</span>
</button>

  { title: "The One with Phoebe's Wedding", season: 10, episode: 12 },
  { title: "The One Where Joey Speaks French", season: 10, episode: 13 },
  { title: "The One with Princess Consuela", season: 10, episode: 14 },
  { title: "The One Where Estelle Dies", season: 10, episode: 15 },
  { title: "The One with Rachel's Going Away Party", season: 10, episode: 16 },
  { title: "The Last One Part 1", season: 10, episode: 17 },
  { title: "The Last One Part 2", season: 10, episode: 18 }
];

let remainingEpisodes = [];
let currentEpisode = null;
let correct = 0;
let incorrect = 0;

const grid = document.getElementById("episodeGrid");
const feedback = document.getElementById("feedback");

function buildGrid() {
  grid.innerHTML = "";
  for (let ep = 1; ep <= 25; ep++) {
    for (let season = 1; season <= 10; season++) {
      const episodeExists = episodes.some(e => e.season === season && e.episode === ep);
      const cell = document.createElement("div");
      cell.className = "episode-cell";
      if (episodeExists) {
        cell.id = `s${season}e${ep}`;
        cell.textContent = `S${season}E${ep}`;
      } else {
        cell.style.visibility = "hidden";
      }
      grid.appendChild(cell);
    }
  }
}

// Mobile Grid
const mobileGrid = document.getElementById("mobileEpisodeGrid");

function buildMobileGrid() {
  mobileGrid.innerHTML = "";
  for (let ep = 1; ep <= 25; ep++) {
    for (let season = 1; season <= 10; season++) {
      const episodeExists = episodes.some(e => e.season === season && e.episode === ep);
      const cell = document.createElement("div");
      cell.className = "episode-cell";
      if (episodeExists) {
        cell.id = `m-s${season}e${ep}`;
        cell.textContent = `S${season}E${ep}`;
      } else {
        cell.style.visibility = "hidden";
      }
      mobileGrid.appendChild(cell);
    }
  }
}

// Show overlay
document.getElementById("mobile-grid-btn").onclick = () => {
  buildMobileGrid();
  document.getElementById("grid-overlay").classList.remove("hidden");
};

// Close overlay
document.getElementById("close-overlay").onclick = () => {
  document.getElementById("grid-overlay").classList.add("hidden");
};

function updateStats() {
  document.getElementById("score").innerText = correct;
  document.getElementById("incorrect-score").innerText = incorrect;

  const high = Number(localStorage.getItem("friendsHighScore") || 0);
  if (correct > high) localStorage.setItem("friendsHighScore", correct);

  document.getElementById("high-score").innerText = localStorage.getItem("friendsHighScore");
  const today = new Date().toLocaleDateString();
  localStorage.setItem("friendsLastPlayed", today);
  document.getElementById("last-played").innerText = today;
}

function nextEpisode() {
  feedback.innerText = "";
  if (remainingEpisodes.length === 0) {
    document.getElementById("episode-title").innerText = "Game complete";
    return;
  }

  const index = Math.floor(Math.random() * remainingEpisodes.length);
  currentEpisode = remainingEpisodes.splice(index, 1)[0];
  document.getElementById("episode-title").innerText = `"${currentEpisode.title}"`;

  document.getElementById("season-input").value = "";
  document.getElementById("episode-input").value = "";
}

document.getElementById("submit-btn").onclick = () => {
  if (!currentEpisode) return;

  const s = Number(document.getElementById("season-input").value);
  const e = Number(document.getElementById("episode-input").value);
  const cellId = `s${currentEpisode.season}e${currentEpisode.episode}`;
  const correctCell = document.getElementById(cellId);

  if (s === currentEpisode.season && e === currentEpisode.episode) {
    correct++;
    if (correctCell) correctCell.classList.add("correct");
    feedback.innerText = "Correct!";
  } else {
    incorrect++;
    if (correctCell) correctCell.classList.add("incorrect");
    feedback.innerText = `Incorrect. Season ${currentEpisode.season} Episode ${currentEpisode.episode}`;
  }

  updateStats();

  setTimeout(() => {
    nextEpisode();
  }, 2000);
};

document.getElementById("restart-btn").onclick = () => {
  correct = 0;
  incorrect = 0;
  remainingEpisodes = [...episodes];
  buildGrid();
  updateStats();
  nextEpisode();
};

window.onload = () => {
  remainingEpisodes = [...episodes];
  buildGrid();
  updateStats();
  nextEpisode();
};
</script>
</body>
</html>
